id: "COMP_001"
name: "instruction_compliance"
enabled: true
severity: "high"

rules:
  - condition: "format_validation"
    parameters:
      required_formats:
        - "JSON"
        - "MARKDOWN_TABLE"
      forbidden_formats:
        - "PLAIN_TEXT_WITH_MARKDOWN"

judge:
  enabled: false

action:
  type: "BLOCK"
  message: "요구된 출력 형식을 준수하지 않아 응답이 차단되었습니다."
