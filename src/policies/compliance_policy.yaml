id: "COMP_001"
name: "instruction_compliance"
version: "1.2.0"
enabled: true
type: "rule"
severity: "high"
priority: 90

# A-7 MEDIUM 해소: 중복을 피하고 명시적 트리거 필드로 통일
judge_required: "rule_triggered"

# 명확한 상태 정의: Instruction Compliance는 검색된 문서 데이터가 불필요함
preconditions:
  requires_retrieved_context: false

rules:
  - condition: "format_validation"
    # B-1 연관 문제 해소: Rule 실패(포맷 불일치) 시 Judge 2차 검증 없이 즉시 차단
    on_rule_failure: "block_immediately"
    parameters:
      required_formats:
        - "JSON"
        - "MARKDOWN_TABLE"
      forbidden_formats:
        - "PLAIN_TEXT_WITH_MARKDOWN"
      # PRD 명세 기준의 구체적인 포맷 검증 방식 정의 (policy_engine.py 구현 가이드)
      validation_rules:
        JSON: "json.loads(response) 예외 없이 파싱 성공 여부 확인"
        MARKDOWN_TABLE: "응답 내에 '|' 문자로 시작하는 행이 2개 이상 존재하는지 확인"
        PLAIN_TEXT_WITH_MARKDOWN: "'#', '**', '`' 등 마크다운 특수 기호 패턴 포함 여부 확인"

judge:
  enabled: true  # 규칙 기반에서 놓치는 미세한 포맷 위반(예: JSON 밖의 주석)을 잡기 위해 활성화
  criteria: >
    사용자가 요구한 출력 형식(JSON, Markdown Table 등)을 완벽히 준수했는지 판정하세요.

    - FAIL 사유:
      1. JSON 형식이라고 했으나 앞뒤에 "네, 알겠습니다" 같은 불필요한 설명 문구가 붙은 경우.
      2. 표(Table) 형식을 요구했으나 일반 텍스트로 나열한 경우.
      3. 데이터 구조가 사용자가 요청한 키(Key) 값을 누락한 경우.
    - PASS 사유: 오직 요구된 포맷 데이터만 깔끔하게 출력된 경우.

action:
  type: "BLOCK"
  # 앞선 content_policy 구조와 일관성을 맞추기 위해 필드명 통일
  fallback_response: "요구된 출력 형식을 준수하지 않아 응답이 차단되었습니다."

conflict_resolution:
  block_overrides_log: true
  use_policy_priority: true
  fallback_message_policy: "highest_priority_block"
