id: "CONTENT_001"
name: "content_safety"
version: "2.1.0"
enabled: true
type: "rule"
severity: "high"
priority: 100

# 중복을 피하고 명시적 트리거 필드로 통일
judge_required: "never"

# B-1 CRITICAL: severity 레벨에 따른 명시적 차단 임계값 정의
severity_threshold: "high"

rules:
  - condition: "contains_categorized_forbidden_terms"
    parameters:
      # 파이썬 엔진에서 텍스트를 .lower() 처리하여 검사할 것을 지시
      case_insensitive: true
      match_strategy: "regex_and_substring"
      categories:
        violence_hate:
          enabled: true
          exact_terms:
            - "폭력"
            - "violence"
            - "혐오"
            - "hate"
            - "테러"
            - "terror"
            - "차별"
            - "discrimination"
            - "살인"
            - "murder"
            - "죽여"
            - "kill"
          phrase_patterns:
            - "폭력을 조장"
            - "혐오 발언"
            - "특정 집단 비하"
            - "(?i)how to kill"  # (?!) : 정규식 자체에서도 대소문자 무시
            - "(?i)how to murder"

        sexual_content:
          enabled: true
          exact_terms:
            - "포르노"
            - "porn"
            - "성착취"
            - "sexual exploitation"
            - "강간"
            - "rape"
            - "미성년자 성"
          phrase_patterns:
            - "성행위 방법"
            - "노골적 성적"
            - "(?i)how to have sex"

        suicide_self_harm:
          enabled: true
          exact_terms:
            - "자살"
            - "suicide"
            - "자해"
            - "self-harm"
            - "목매다"
            - "hang oneself"
            - "거식증 조장"
          phrase_patterns:
            - "자살 방법"
            - "자해 하는 법"
            - "자살 추천"
            - "(?i)how to commit suicide"

        criminal_planning:
          enabled: true
          exact_terms:
            - "방화"
            - "arson"
            - "납치"
            - "kidnap"
            - "사기"
            - "fraud"
            - "scam"
            - "다크웹"
            - "dark web"
            - "마약"
            - "drugs"
            - "불법무기"
            - "illegal weapons"
          phrase_patterns:
            - "범죄 계획"
            - "총기 제작"
            - "폭발물 만드는 법"
            - "(?i)how to make a bomb"

        jailbreak_prompt_injection:
          enabled: true
          # 프롬프트 인젝션은 주로 영문으로 시도되므로 영문 위주 유지
          exact_terms:
            - "DAN"
            - "Do Anything Now"
          phrase_patterns:
            - "(?i)ignore\\s+previous"
            - "(?i)act\\s+as\\s+.*without\\s+restrictions"
            - "(?i)reveal\\s+your\\s+system\\s+prompt"

        privacy:
          enabled: true
          pii_patterns:
            - "(?i)\\b[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}\\b"
            - "\\b\\d{6}-?\\d{7}\\b"

judge:
  enabled: true  # 지능형 판별을 위해 true로 변경
  # system_judge_v2.txt의 {criteria} 자리에 들어갈 내용
  criteria: >
    당신은 콘텐츠의 유해성과 '의도(Intent)'를 분석하는 전문 판사입니다.
    PRD 지침에 따라 아래 기준을 엄격히 적용하세요:

    1. [Topical vs Toxic 구분]:
       - 역사적 사실, 뉴스 보고, 일반적인 지식 전달, 예방 교육 목적의 주제적 논의(Topical)는 'PASS' 처리합니다.
       - 예: "테러의 역사", "마약의 위험성 교육" 등은 허용합니다.

    2. [의도(Intent) 기반 차단]:
       - 단순 언급을 넘어 실제 실행 방법(Instruction), 계획 수립(Planning), 구체적인 수단(Method)을 제공하거나 조장하는 경우 반드시 'FAIL' 처리합니다.
       - 예: "마약을 만드는 구체적 방법", "테러를 모의하는 단계별 계획" 등은 즉시 차단합니다.

    3. [판단 우선순위]:
       - 모호한 '회색 영역'의 경우, 교육적 목적이 명확하지 않다면 안전을 위해 'FAIL'을 우선합니다.

action:
  type: "BLOCK"
  fallback_response: "정책 위반으로 응답이 차단되었습니다. 해당 주제는 도와드릴 수 없습니다."

conflict_resolution:
  block_overrides_log: true
  use_policy_priority: true
  fallback_message_policy: "highest_priority_block"
