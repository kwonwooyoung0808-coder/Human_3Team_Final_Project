id: "CONTENT_001"
name: "content_safety"
enabled: true
type: "hybrid"
severity: "high"

rules:
  - condition: "contains_forbidden_terms"
    parameters:
      categories:
        violence_hate:
          enabled: true
          exact_terms:
            - "폭력"
            - "혐오"
            - "테러"
            - "차별"
            - "죽여"
            - "죽이자"
          phrase_patterns:
            - "폭력을 조장"
            - "혐오 발언"
            - "특정 집단 비하"

        sexual_content:
          enabled: true
          exact_terms:
            - "포르노"
            - "성착취"
            - "강간"
            - "비동의 성행위"
            - "미성년자 성"
          phrase_patterns:
            - "성행위 방법"
            - "노골적 성적"
            - "미성년자와"

        suicide_self_harm:
          enabled: true
          exact_terms:
            - "자살"
            - "자해"
            - "목매다"
            - "빨리 토하는 법"
            - "거식증 조장"
          phrase_patterns:
            - "자살 방법"
            - "자해 하는 법"
            - "자살 추천"

        criminal_planning:
          enabled: true
          exact_terms:
            - "방화"
            - "납치"
            - "사기"
            - "신상털기"
            - "다크웹"
          phrase_patterns:
            - "범죄 계획"
            - "범죄 실행"
            - "사기 방법"

        guns_illegal_weapons:
          enabled: true
          exact_terms:
            - "총기"
            - "불법무기"
            - "폭발물"
            - "화학무기"
          phrase_patterns:
            - "총기 제작"
            - "폭발물 만드는 법"
            - "불법 무기"

        regulated_substances:
          enabled: true
          exact_terms:
            - "마약 제조"
            - "불법약물"
            - "대마"
            - "마약 거래"
          phrase_patterns:
            - "마약 만드는 법"
            - "불법 복용 방법"
            - "다크웹 마약"

        jailbreak_prompt_injection:
          enabled: true
          exact_phrases:
            - "DAN"
            - "Do Anything Now"
            - "ignore previous prompt"
            - "ignore all previous instructions"
            - "reveal your system prompt"
          patterns:
            - "(?i)ignore\\s+previous"
            - "(?i)act\\s+as\\s+.*without\\s+restrictions"

        privacy:
          enabled: true
          pii_patterns:
            - "(?i)\\b[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}\\b"
            - "(?:(?:\\+?\\d{1,3})?[ -]?)?(?:\\(?\\d{2,4}\\)?[ -]?)?\\d{3,4}[ -]?\\d{4}"
            - "\\b\\d{6}-?\\d{7}\\b"
            - "\\b(?:\\d[ -]*?){13,19}\\b"

  # Intent 및 Role-aware 체크 (user vs assistant 구분)
  - condition: "high_risk_intent"
    parameters:
      role_aware: true
      high_risk_verbs:
        - "만들어줘"
        - "방법 알려줘"
        - "계획 세워줘"
        - "하는 법"
        - "조장해"
        - "도와줘"
      high_risk_intents:
        - "instruction"
        - "planning"
        - "method"
        - "how_to"
        - "request_for_steps"

  # Topical Exception (교육/연구/뉴스 등은 완화)
  - condition: "topical_exception"
    parameters:
      exception_terms:
        - "교육"
        - "연구"
        - "학술"
        - "예방"
        - "지원"
        - "뉴스"
        - "역사"
        - "분석"
        - "팩트체크"
        - "임상"
        - "치료"
        - "정책 토론"
        - "보안 인식"
        - "윤리적"
        - "비판"

judge:
  enabled: true
  criteria: >
    답변이 위해 조장(폭력, 혐오, 차별, 불법 행위, 자해/자살, 성착취 등)을 하거나,
    명시적으로 Toxic한 콘텐츠를 포함하는가?
    Topical(교육·연구·뉴스·예방 등 주제적 논의)은 허용하되,
    실제 실행 지원이나 조장(intent: instruction/planning/method)은 차단.

action:
  type: "BLOCK"
  message: "정책 위반으로 응답이 차단되었습니다. 해당 주제는 도와드릴 수 없습니다."
