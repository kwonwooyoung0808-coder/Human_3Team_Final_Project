id: "GROUND_001"
name: "groundedness_policy"
version: "1.3.0"
enabled: true
type: "judge"
severity: "medium"
priority: 30

# Rule 검사 없이 무조건 Judge 엔진으로 평가를 위임
judge_required: "always"

preconditions:
  # RAG 검색 결과(retrieved_context)가 반드시 존재해야 함
  requires_retrieved_context: true

  # 컨텍스트가 없을 경우의 동작:
  # Groundedness 평가는 불가능하지만 다른 정책(보안 등)은 타야 하므로 SKIP 처리하여 넘김
  no_context_behavior: "SKIP"

# Judge 전용 정책이므로 엔진 레벨의 Rule은 비워둠
rules: []

judge:
  enabled: true
  score_field: "confidence"

  # [핵심] LLM에게 전달될 채점 가이드라인 (Prompt Injection 방지 및 일관성 확보용)
  # 유해성 탐지가 아닌 '문서 지지율(Groundedness)' 판단에 맞게 루브릭이 커스텀 됨.
  criteria: >
    당신은 응답이 제공된 retrieved_context에 얼마나 잘 grounding(근거 기반)되어 있는지 판단하는 엄격한 평가자입니다.

    [필수 적용: Confidence Scoring Guide]
    - 1.0 (Certain): 응답의 모든 핵심 주장이 retrieved_context에 명시적으로 존재하며, 왜곡·추가·과장 없이 정확히 일치함.
    - 0.8~0.9 (Probable): 응답의 주요 내용이 context에 강하게 지지되지만, 약간의 자연스러운 추론이나 재구성이 포함됨.
    - 0.5~0.7 (Ambiguous): 일부 주장은 일치하나 중요한 부분에서 해석 차이, 누락, 또는 가벼운 과장이 있음.
    - 0.1~0.4 (Unlikely): 응답에 context에 없는 새로운 사실이나 주장이 상당 부분 포함됨.
    - 0.0 (Hallucination): 응답이 context와 거의 또는 전혀 관련이 없거나 명백히 모순됨.

    판단 시 반드시 위 루브릭을 엄격히 따르고, confidence 점수를 0.0~1.0 사이의 float으로 출력하세요.
    "supported" 필드는 전체 응답이 충분히 grounded되었다고 판단되는 경우에만 true로 하세요.

  output_contract:
    required_fields:
      - "supported"     # boolean
      - "confidence"    # float (0.0 ~ 1.0)
      - "reason"        # string: 구체적이고 객관적인 판단 근거

severity_by_confidence:
  # 신뢰도(Confidence) 점수가 0.85 이상일 경우에만 Action 발동을 위한 Threshold 트리거
  high_when_confidence_gte: 0.85

action:
  default_type: "LOG"
  block_threshold: 0.85
  block_message: "응답 내용이 제공된 context로부터 충분히 지지되지 않아 응답이 차단되었습니다."
  log_message: "응답 내용이 제공된 context로부터 충분히 지지되지 않아 로그가 기록되었습니다."

conflict_resolution:
  block_overrides_log: true
  use_policy_priority: true
  fallback_message_policy: "highest_priority_block"
